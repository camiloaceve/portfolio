<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="75" cy="75" r="75" fill="url(#bgGradient)"/>
  
  <!-- Person silhouette -->
  <g fill="white">
    <!-- Head -->
    <circle cx="75" cy="55" r="20"/>
    <!-- Shoulders and upper body -->
    <path d="M 75 75 C 55 75, 45 85, 45 100 L 45 120 C 45 125, 50 130, 55 130 L 95 130 C 100 130, 105 125, 105 120 L 105 100 C 105 85, 95 75, 75 75 Z"/>
  </g>
</svg>
