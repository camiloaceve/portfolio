<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clip mask for circular image -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="75" cy="75" r="75"/>
    </clipPath>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Border circle with gradient -->
  <circle cx="75" cy="75" r="73" fill="none" stroke="url(#borderGradient)" stroke-width="4"/>
  
  <!-- Placeholder for your photo - replace the href with your image -->
  <image href="assets/your-photo.jpg" x="0" y="0" width="150" height="150" clip-path="url(#circleClip)"/>
  
  <!-- Optional: Add subtle overlay for better contrast -->
  <circle cx="75" cy="75" r="71" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</svg>
